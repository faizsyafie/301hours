<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0a">
  <title>301 TERMINAL</title>
  <meta name="description" content="CFA study tracker: hours banked, a desk-cam Pomodoro and a curriculum watchlist.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23ffb000'/><text x='16' y='22' font-family='monospace' font-weight='700' font-size='14' text-anchor='middle' fill='%230b0b0a'>301</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-box">301</span><span class="brand-word">TERMINAL</span></a>
    <nav class="nav">
      <a href="#/" data-route="dashboard"><kbd>1</kbd>DASH</a>
      <a href="#/study" data-route="study"><kbd>2</kbd>STUDY</a>
      <a href="#/topics" data-route="topics"><kbd>3</kbd>TOPICS</a>
      <a href="#/settings" data-route="settings"><kbd>4</kbd>SETUP</a>
      <button type="button" class="nav-about" data-about><kbd>?</kbd>ABOUT</button>
    </nav>
    <div class="topbar-right">
      <div class="levels" role="radiogroup" aria-label="CFA level">
        <button type="button" data-level="1" role="radio">L1</button>
        <button type="button" data-level="2" role="radio">L2</button>
        <button type="button" data-level="3" role="radio">L3</button>
      </div>
      <a class="mini-timer" href="#/study" hidden></a>
      <button class="sync" type="button" title="Sync status"></button>
      <span class="clock num"></span>
    </div>
  </header>
  <div class="tape-bar" aria-hidden="true"><div class="tape-track"></div></div>
  <div class="breaking" hidden role="status"></div>
  <div class="banner" hidden></div>
  <main id="view"></main>
  <div id="cam-holder" hidden></div>

  <dialog id="passcode-dialog">
    <form method="dialog" class="passcode-form">
      <div class="phead"><span>AUTHENTICATE</span></div>
      <p class="note">Enter the passcode you set in Vercel (<code>APP_PASSCODE</code>). Once per device.</p>
      <input name="code" type="password" autocomplete="current-password" required autofocus>
      <p class="error" hidden></p>
      <div class="row end">
        <button value="cancel" formnovalidate class="btn">USE OFFLINE</button>
        <button value="ok" class="btn primary">UNLOCK</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>

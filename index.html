<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>301hours</title>
  <meta name="description" content="CFA study tracker with a presence-checked Pomodoro timer.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%232a78d6' stroke-width='4'/><path d='M16 9v7l5 3' stroke='%232a78d6' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">301<span>hours</span></a>
    <nav class="nav">
      <a href="#/" data-route="dashboard">Dashboard</a>
      <a href="#/study" data-route="study">Study</a>
      <a href="#/topics" data-route="topics">Topics</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
    <div class="topbar-right">
      <a class="mini-timer" href="#/study" hidden></a>
      <button class="sync" type="button" title="Sync status"></button>
    </div>
  </header>
  <div class="banner" hidden></div>
  <main id="view"></main>
  <div id="cam-holder" hidden></div>

  <dialog id="passcode-dialog">
    <form method="dialog" class="passcode-form">
      <h2>Enter passcode</h2>
      <p class="muted">Your data is protected by the passcode set in Vercel (<code>APP_PASSCODE</code>). You only need to enter it once per device.</p>
      <input name="code" type="password" autocomplete="current-password" required autofocus>
      <p class="error" hidden></p>
      <div class="row end">
        <button value="cancel" formnovalidate class="btn ghost">Use offline</button>
        <button value="ok" class="btn primary">Unlock</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
